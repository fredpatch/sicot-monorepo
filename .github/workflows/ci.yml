name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Static compose-config check (Phase 12.1) - guards against the
      # translation-service Docker wiring defect recurring. Docker Compose
      # v2 ships preinstalled on GitHub-hosted ubuntu-latest runners.
      - run: npm run verify:translation-wiring
      # No automated test suite exists yet - `build` runs `tsc` for every
      # workspace (shared/server/client) plus the Vite build, so it's the
      # closest thing to a type-safety gate until tests are added.
      - run: npm run build
