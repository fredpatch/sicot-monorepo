name: Publish Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  publish:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        include:
          - name: sicot-api
            dockerfile: packages/server/Dockerfile
          - name: sicot-client
            dockerfile: packages/client/Dockerfile
          - name: sicot-ocr
            dockerfile: packages/ocr-service/Dockerfile
          - name: sicot-translate
            dockerfile: packages/translate-service/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - id: image-owner
        run: echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-owner.outputs.owner }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.image-owner.outputs.owner }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      # Fail-open vulnerability scan — report but don't block. Flip exit-code
      # to "1" once the project is mature enough to gate merges on it.
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.image-owner.outputs.owner }}/${{ matrix.name }}:${{ github.sha }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
